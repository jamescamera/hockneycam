<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8E9A93">
<title>JOINER — a composite camera</title>
<style>
  :root{
    --wall:#8E9A93;
    --card:#F6F3EC;
    --ink:#171512;
    --ink-soft:#6a655c;
    --pool:#1E6FA8;
    --amber:#C9761F;
    --rule:rgba(23,21,18,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;background:var(--wall);overflow:hidden;}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);
    -webkit-user-select:none;user-select:none;
  }
  #stage{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;}
  video{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;top:0;left:0;}

  #label{
    position:fixed;left:16px;bottom:16px;z-index:20;
    width:290px;max-width:calc(100% - 32px);
    background:var(--card);
    box-shadow:0 1px 2px rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.22);
    padding:14px 16px 12px;
    touch-action:auto;
  }
  #label.tucked{opacity:.28;}
  #label .plate{
    font-family:Georgia,"Times New Roman",serif;
    font-size:17px;line-height:1.15;letter-spacing:.01em;margin:0 0 2px;
  }
  #label .plate em{font-style:italic;}
  #label .medium{
    font-size:10.5px;line-height:1.45;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-soft);margin:0;
  }
  #label .rule{height:1px;background:var(--rule);margin:11px 0 10px;}

  .row{display:flex;gap:5px;flex-wrap:wrap;}
  button{
    font:inherit;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    background:transparent;color:var(--ink);
    border:1px solid var(--rule);border-radius:0;
    padding:7px 8px;cursor:pointer;flex:1 1 30%;min-width:0;
    transition:background .15s,color .15s,border-color .15s;
  }
  button:hover{border-color:var(--ink);}
  button:active{background:var(--ink);color:var(--card);}
  button.on{background:var(--pool);border-color:var(--pool);color:#fff;}
  button:focus-visible{outline:2px solid var(--pool);outline-offset:2px;}

  #tray{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.2,.8,.25,1);}
  #tray.open{max-height:520px;}
  .field{margin:12px 0 0;}
  .field label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field label b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums;}
  .note{font-size:9.5px;letter-spacing:.07em;line-height:1.6;color:var(--ink-soft);margin:12px 0 0;text-transform:uppercase;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;display:block;
  }
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule);}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-6px;
    background:var(--ink);border-radius:50%;border:0;
  }
  input[type=range]::-moz-range-track{height:1px;background:var(--rule);}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;background:var(--ink);border:0;border-radius:50%;}
  input[type=range]:focus-visible{outline:2px solid var(--pool);outline-offset:4px;}

  .seg{display:flex;border:1px solid var(--rule);}
  .seg button{border:0;border-right:1px solid var(--rule);flex:1 1 0;padding:7px 3px;}
  .seg button:last-child{border-right:0;}

  #gate{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:var(--wall);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    padding:32px;text-align:center;
  }
  #gate .plaque{
    background:var(--card);padding:26px 30px 24px;max-width:340px;
    box-shadow:0 1px 2px rgba(0,0,0,.18),0 14px 40px rgba(0,0,0,.25);
  }
  #gate h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:26px;
    margin:0 0 8px;letter-spacing:.01em;
  }
  #gate h1 em{font-style:italic;}
  #gate p{font-size:11px;line-height:1.7;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 20px;text-transform:uppercase;}
  #gate button{width:100%;flex:none;padding:12px;font-size:10px;border-color:var(--ink);}
  #err{margin-top:14px;font-size:11px;line-height:1.6;color:var(--amber);letter-spacing:.03em;text-transform:none;display:none;}

  #flash{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none;z-index:50;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
  @media (max-width:520px){
    #label{left:10px;right:10px;bottom:10px;width:auto;max-width:none;padding:12px 13px 11px;}
    #label .plate{font-size:15px;}
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<video id="vid" playsinline autoplay muted></video>
<div id="flash"></div>

<div id="label">
  <p class="plate">Untitled <em>Composite</em></p>
  <p class="medium" id="medium">32 prints · polaroid · grid</p>
  <div class="rule"></div>
  <div class="row">
    <button id="bShuffle">Re-shoot</button>
    <button id="bFrame">Frame</button>
    <button id="bLive">Live</button>
    <button id="bHold">Hold</button>
    <button id="bSave">Save</button>
    <button id="bTray">Setup</button>
  </div>
  <div id="tray">
    <div class="field">
      <label>Layout</label>
      <div class="seg" id="segLayout">
        <button data-v="grid" class="on">Grid</button>
        <button data-v="scatter">Scatter</button>
        <button data-v="fan">Fan</button>
        <button data-v="strip">Strip</button>
      </div>
    </div>
    <div class="field">
      <label>Stock</label>
      <div class="seg" id="segStock">
        <button data-v="polaroid" class="on">Polaroid</button>
        <button data-v="print">C-print</button>
        <button data-v="bleed">Bleed</button>
      </div>
    </div>
    <div class="field">
      <label>Prints <b id="vCount">32</b></label>
      <input type="range" id="sCount" min="6" max="120" value="32">
    </div>
    <div class="field">
      <label>Zoom range <b id="vLens">70</b></label>
      <input type="range" id="sLens" min="0" max="100" value="70">
    </div>
    <div class="field">
      <label>Hand <b id="vHand">40</b></label>
      <input type="range" id="sHand" min="0" max="100" value="40">
    </div>
    <div class="field">
      <label><span id="rateName">Seconds per print</span> <b id="vRate">1.4</b></label>
      <input type="range" id="sRate" min="2" max="80" value="14">
    </div>
    <div class="field">
      <div class="row">
        <button id="bFlip">Flip camera</button>
        <button id="bWall">Wall</button>
      </div>
    </div>
    <p class="note">Drag a print to move it · pinch to zoom its lens and turn it · double tap to re-expose</p>
  </div>
</div>

<div id="gate">
  <div class="plaque">
    <h1>Joiner<br><em>a composite camera</em></h1>
    <p>One subject. Many lenses. Many moments.<br>Assembled while you sit still.</p>
    <button id="bStart">Open the shutter</button>
    <div id="err"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var vid    = document.getElementById('vid');
  var stage  = document.getElementById('stage');
  var ctx    = stage.getContext('2d');
  var gate   = document.getElementById('gate');
  var errEl  = document.getElementById('err');
  var flash  = document.getElementById('flash');
  var medium = document.getElementById('medium');
  var labelEl= document.getElementById('label');

  var W = 0, H = 0, DPR = 1;
  var srcC = document.createElement('canvas');
  var srcX = srcC.getContext('2d');
  var prints = [];
  var facing = 'user';
  var stream = null;
  var held = false;
  var ready = false;
  var rr = 0;

  var WALLS = ['#8E9A93','#B7AFA0','#2A2E31','#C6C9C4','#7C6F63'];
  var wallIdx = 0;

  var opt = {
    layout:'grid', stock:'polaroid', live:false,
    count:32, lens:70, hand:40, rate:14
  };

  var blendOK = (function(){
    var c = document.createElement('canvas').getContext('2d');
    c.globalCompositeOperation = 'multiply';
    return c.globalCompositeOperation === 'multiply';
  })();

  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
            function(f){ return setTimeout(f,16); };
  var now = function(){
    return (window.performance && performance.now) ? performance.now() : Date.now();
  };

  /* ---------- grain ---------- */
  var grain = document.createElement('canvas');
  grain.width = grain.height = 96;
  (function(){
    var g = grain.getContext('2d');
    var d = g.createImageData(96,96), i;
    for(i=0;i<d.data.length;i+=4){
      var n = 128 + (Math.random()*90-45);
      d.data[i]=d.data[i+1]=d.data[i+2]=n;
      d.data[i+3]=24;
    }
    g.putImageData(d,0,0);
  })();

  function rand(a,b){ return a + Math.random()*(b-a); }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  /* ---------- history ring, for live time-drift ---------- */
  var HN = 10, hist = [], hi = 0, histReady = false;
  function ensureHist(){
    if(histReady || !srcC.width) return;
    var w = 512, h = Math.round(512 * (srcC.height/srcC.width)), i;
    hist = [];
    for(i=0;i<HN;i++){
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      hist.push(c);
    }
    hi = 0; histReady = true;
  }
  function pushHist(){
    if(!histReady) return;
    var c = hist[hi];
    c.getContext('2d').drawImage(srcC, 0, 0, c.width, c.height);
    hi = (hi + 1) % HN;
  }
  function histFrame(lag){
    if(!histReady) return srcC;
    var back = Math.floor(clamp(lag,0,1) * (HN - 1));
    return hist[((hi - 1 - back) % HN + HN) % HN];
  }

  /* ---------- sizing ---------- */
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth; H = stage.clientHeight;
    stage.width = Math.round(W*DPR);
    stage.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    if(ready) layout();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize,300); });

  /* ---------- camera ---------- */
  function start(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      fail('This browser will not hand over a camera. Try Chrome or Safari, over https.');
      return;
    }
    navigator.mediaDevices.getUserMedia({
      video:{ facingMode:facing, width:{ideal:1280}, height:{ideal:960} },
      audio:false
    }).then(function(s){
      if(stream){ var t=stream.getTracks(), i; for(i=0;i<t.length;i++) t[i].stop(); }
      stream = s;
      vid.srcObject = s;
      var p = vid.play();
      if(p && p['catch']) p['catch'](function(){});
      vid.addEventListener('loadedmetadata', begin);
      if(vid.videoWidth) begin();
    })['catch'](function(e){
      fail('No camera. ' + (e && e.name ? e.name : '') + ' — check the permission for this page in your browser settings, then reload.');
    });
  }
  function fail(msg){ errEl.textContent = msg; errEl.style.display = 'block'; }

  function begin(){
    if(ready) return;
    ready = true;
    gate.style.display = 'none';
    resize();
    layout();
    tick();
  }

  function grab(){
    if(!vid.videoWidth) return false;
    var vw = vid.videoWidth, vh = vid.videoHeight;
    if(srcC.width !== vw){ srcC.width = vw; srcC.height = vh; histReady = false; }
    srcX.save();
    if(facing === 'user'){ srcX.translate(vw,0); srcX.scale(-1,1); }
    srcX.drawImage(vid,0,0,vw,vh);
    srcX.restore();
    return true;
  }

  /* ---------- lens tiers ---------- */
  function pickLens(){
    var r = Math.random(), base;
    if(r < 0.18)      base = rand(0.09, 0.19);   // one eye
    else if(r < 0.48) base = rand(0.19, 0.40);   // features
    else if(r < 0.80) base = rand(0.40, 0.70);   // head
    else              base = rand(0.72, 1.00);   // whole scene
    var spread = opt.lens/100;
    return clamp(0.55 + (base - 0.55) * spread, 0.07, 1.0);
  }

  function stockShape(){
    if(opt.stock === 'polaroid') return {ar:1,    side:.065, top:.065, bot:.20};
    if(opt.stock === 'print')    return {ar:0.75, side:.035, top:.035, bot:.035};
    return {ar:0.80, side:0, top:0, bot:0};
  }

  /* ---------- layout ---------- */
  function layout(){
    var n = opt.count, sh = stockShape(), hand = opt.hand/100;
    var cols = Math.max(2, Math.round(Math.sqrt(n * (W/Math.max(H,1)))));
    var rows = Math.ceil(n/cols);
    var k, i, j;
    prints = [];

    for(k=0;k<n;k++){
      i = k % cols; j = Math.floor(k/cols);
      var cell = Math.min(W/cols, H/rows);
      var cx, cy, rot, size;

      if(opt.layout === 'grid'){
        cx = (i + .5)/cols * W + rand(-1,1) * cell * .18 * hand;
        cy = (j + .5)/rows * H + rand(-1,1) * cell * .18 * hand;
        rot = rand(-1,1) * 0.10 * hand;
        size = cell * rand(1.10, 1.36);
      } else if(opt.layout === 'scatter'){
        cx = rand(.12,.88) * W;
        cy = rand(.14,.86) * H;
        rot = rand(-1,1) * 0.55 * hand;
        size = cell * rand(0.85, 1.9);
      } else if(opt.layout === 'fan'){
        var a = (k/n) * Math.PI * 2;
        var r2 = Math.min(W,H) * (0.06 + 0.34 * Math.sqrt(k/n));
        cx = W/2 + Math.cos(a*1.7) * r2;
        cy = H/2 + Math.sin(a*1.7) * r2 * 0.9;
        rot = a*0.3 * hand + rand(-.2,.2) * hand;
        size = cell * rand(1.0, 1.7);
      } else {
        var per = Math.max(1, Math.floor(W / (Math.min(W,H)*0.26)));
        var srows = Math.max(1, Math.ceil(n/per));
        size = Math.min(W/per, H/srows) * 1.06;
        cx = ((k % per) + .5)/per * W;
        cy = (Math.floor(k/per) + .5)/srows * H;
        rot = rand(-1,1) * 0.05 * hand;
      }

      // a handful of oversized prints laid over the top, as in the reference
      if(Math.random() < 0.15) size *= rand(1.45, 2.05);

      var photoW = size, photoH = size * (1/sh.ar);
      var lens = pickLens();
      var u, v;

      if(opt.layout === 'grid' || opt.layout === 'strip'){
        u = (i + .5)/cols; v = (j + .5)/rows;
      } else {
        u = cx/W; v = cy/H;
      }
      u += rand(-1,1) * .06 * hand;
      v += rand(-1,1) * .06 * hand;

      // tight lenses gravitate to the face rather than the corners
      var pull = (1 - lens); pull = pull * pull * 0.8;
      u = u + (0.50 - u) * pull;
      v = v + (0.42 - v) * pull;

      prints.push({
        cx:cx, cy:cy, rot:rot,
        pw:photoW, ph:photoH,
        side:sh.side, top:sh.top, bot:sh.bot,
        u:clamp(u,0,1), v:clamp(v,0,1),
        lens:lens,
        lag: Math.random(),
        warm: rand(-1,1),
        expo: rand(-1,1),
        canvas:null, pat:null,
        next:0, every:0,
        z: Math.random()
      });
    }

    prints.sort(function(a,b){ return a.z - b.z; });
    for(k=0;k<prints.length;k++){
      prints[k].every = (opt.rate/10) * 1000 * rand(0.45,1.75);
      prints[k].next = now() + Math.random() * prints[k].every;
      shoot(prints[k], srcC);
    }
    updateLabel();
  }

  /* ---------- expose one print ---------- */
  function shoot(p, src){
    if(!src || !src.width) return;
    var res = clamp(Math.round(p.pw * DPR), 64, 460);
    if(!p.canvas) p.canvas = document.createElement('canvas');
    var cw = res, ch = Math.round(res * (p.ph/p.pw));
    if(p.canvas.width !== cw || p.canvas.height !== ch){
      p.canvas.width = cw; p.canvas.height = ch; p.pat = null;
    }
    var g = p.canvas.getContext('2d');

    var sw = src.width * p.lens;
    var sh2 = sw * (p.ph/p.pw);
    if(sh2 > src.height){ sh2 = src.height; sw = sh2 * (p.pw/p.ph); }
    var sx = clamp(p.u * src.width  - sw/2,  0, Math.max(0, src.width  - sw));
    var sy = clamp(p.v * src.height - sh2/2, 0, Math.max(0, src.height - sh2));

    g.globalCompositeOperation = 'source-over';
    g.drawImage(src, sx, sy, sw, sh2, 0, 0, cw, ch);

    var e = p.expo;
    g.fillStyle = e > 0
      ? 'rgba(255,252,244,' + (e*0.13).toFixed(3) + ')'
      : 'rgba(12,10,16,'    + (-e*0.15).toFixed(3) + ')';
    g.fillRect(0,0,cw,ch);

    if(blendOK){
      g.globalCompositeOperation = 'multiply';
      g.fillStyle = p.warm > 0
        ? 'rgba(255,226,186,' + (p.warm*0.30 + .06).toFixed(3) + ')'
        : 'rgba(198,224,255,' + (-p.warm*0.26 + .06).toFixed(3) + ')';
      g.fillRect(0,0,cw,ch);
      g.globalCompositeOperation = 'source-over';
    }

    if(!p.pat) p.pat = g.createPattern(grain,'repeat');
    if(p.pat){ g.fillStyle = p.pat; g.fillRect(0,0,cw,ch); }
  }

  /* ---------- render ---------- */
  function draw(){
    ctx.fillStyle = WALLS[wallIdx];
    ctx.fillRect(0,0,W,H);

    var bleed = (opt.stock === 'bleed');
    var i, p, fw, fh, ox, oy;

    for(i=0;i<prints.length;i++){
      p = prints[i];
      if(!p.canvas) continue;

      fw = p.pw * (1 + p.side*2);
      fh = p.ph + p.pw*p.top + p.pw*p.bot;
      ox = -fw/2; oy = -fh/2;

      ctx.save();
      ctx.translate(p.cx, p.cy);
      ctx.rotate(p.rot);

      ctx.shadowColor = bleed ? 'rgba(0,0,0,.28)' : 'rgba(0,0,0,.34)';
      ctx.shadowBlur = bleed ? 10 : 14;
      ctx.shadowOffsetY = bleed ? 3 : 5;
      ctx.fillStyle = bleed ? '#000' : '#F7F4ED';
      ctx.fillRect(ox, oy, fw, fh);
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

      ctx.drawImage(p.canvas, ox + p.pw*p.side, oy + p.pw*p.top, p.pw, p.ph);
      ctx.restore();
    }
  }

  function tick(){
    if(grab() && !held){
      if(opt.live){
        ensureHist();
        pushHist();
        var budget = Math.min(prints.length, 14), b, pp;
        for(b=0;b<budget;b++){
          pp = prints[rr % prints.length]; rr++;
          shoot(pp, histFrame(pp.lag * (opt.rate/80)));
        }
      } else {
        var t = now(), i;
        for(i=0;i<prints.length;i++){
          if(t >= prints[i].next){
            shoot(prints[i], srcC);
            prints[i].next = t + prints[i].every;
          }
        }
      }
    }
    draw();
    raf(tick);
  }

  /* ---------- touch / mouse ---------- */
  function hit(x,y){
    var i, p, dx, dy, c, s, lx, ly, fw, fh;
    for(i=prints.length-1;i>=0;i--){
      p = prints[i];
      dx = x - p.cx; dy = y - p.cy;
      c = Math.cos(-p.rot); s = Math.sin(-p.rot);
      lx = dx*c - dy*s; ly = dx*s + dy*c;
      fw = p.pw * (1 + p.side*2);
      fh = p.ph + p.pw*p.top + p.pw*p.bot;
      if(Math.abs(lx) <= fw/2 && Math.abs(ly) <= fh/2) return i;
    }
    return -1;
  }

  function toTop(idx){
    var p = prints[idx];
    prints.splice(idx,1);
    prints.push(p);
    return p;
  }

  var drag = null, pinch = null, lastTap = 0, lastTapP = null;

  function pt(e,n){
    var r = stage.getBoundingClientRect();
    var t = e.touches ? e.touches[n||0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }

  function down(e){
    if(e.touches && e.touches.length === 2){
      var a = pt(e,0), b = pt(e,1);
      var mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      var idx = hit(mx,my);
      if(idx < 0) return;
      var p = toTop(idx);
      pinch = {
        p:p,
        d: Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y)),
        ang: Math.atan2(b.y-a.y, b.x-a.x),
        lens0: p.lens, rot0: p.rot
      };
      drag = null;
      if(e.preventDefault) e.preventDefault();
      return;
    }

    var q = pt(e);
    var k = hit(q.x, q.y);
    if(k < 0) return;
    var pp = toTop(k);

    var t = now();
    if(t - lastTap < 320 && lastTapP === pp){
      shoot(pp, srcC);
      lastTap = 0; lastTapP = null;
      if(e.preventDefault) e.preventDefault();
      return;
    }
    lastTap = t; lastTapP = pp;

    drag = { p:pp, dx: q.x - pp.cx, dy: q.y - pp.cy };
    if(e.preventDefault) e.preventDefault();
  }

  function move(e){
    if(pinch && e.touches && e.touches.length === 2){
      var a = pt(e,0), b = pt(e,1);
      var d = Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y));
      var ang = Math.atan2(b.y-a.y, b.x-a.x);
      pinch.p.lens = clamp(pinch.lens0 * (pinch.d / Math.max(d,1)), 0.05, 1.0);
      pinch.p.rot  = pinch.rot0 + (ang - pinch.ang);
      shoot(pinch.p, srcC);
      if(e.preventDefault) e.preventDefault();
      return;
    }
    if(!drag) return;
    var q = pt(e);
    drag.p.cx = q.x - drag.dx;
    drag.p.cy = q.y - drag.dy;
    if(e.preventDefault) e.preventDefault();
  }

  function up(){ drag = null; pinch = null; }

  stage.addEventListener('touchstart', down, false);
  stage.addEventListener('touchmove',  move, false);
  stage.addEventListener('touchend',   up,   false);
  stage.addEventListener('touchcancel',up,   false);
  stage.addEventListener('mousedown',  down, false);
  window.addEventListener('mousemove', move, false);
  window.addEventListener('mouseup',   up,   false);

  /* ---------- label ---------- */
  function updateLabel(){
    var stocks = {polaroid:'polaroid', print:'C-print', bleed:'bleed'};
    medium.textContent = opt.count + ' prints · ' + stocks[opt.stock] + ' · ' +
                         opt.layout + (opt.live ? ' · live' : '');
  }

  /* ---------- controls ---------- */
  function seg(id, key, after){
    var btns = document.getElementById(id).getElementsByTagName('button'), i;
    for(i=0;i<btns.length;i++){
      (function(b){
        b.addEventListener('click', function(){
          var j;
          for(j=0;j<btns.length;j++) btns[j].className = '';
          b.className = 'on';
          opt[key] = b.getAttribute('data-v');
          syncFrameBtn();
          if(after) after();
        });
      })(btns[i]);
    }
  }
  seg('segLayout','layout', layout);
  seg('segStock','stock', layout);

  function slide(id, out, key, fmt, after){
    var s = document.getElementById(id), o = document.getElementById(out);
    s.addEventListener('input', function(){
      opt[key] = parseInt(s.value,10);
      o.textContent = fmt ? fmt(opt[key]) : opt[key];
      if(after) after();
    });
  }
  slide('sCount','vCount','count', null, layout);
  slide('sLens','vLens','lens',  null, layout);
  slide('sHand','vHand','hand',  null, layout);
  slide('sRate','vRate','rate', function(v){ return (v/10).toFixed(1); }, function(){
    var i;
    for(i=0;i<prints.length;i++) prints[i].every = (opt.rate/10)*1000*rand(0.45,1.75);
  });

  function syncStockSeg(){
    var btns = document.getElementById('segStock').getElementsByTagName('button'), i;
    for(i=0;i<btns.length;i++){
      btns[i].className = (btns[i].getAttribute('data-v') === opt.stock) ? 'on' : '';
    }
  }
  function syncFrameBtn(){
    document.getElementById('bFrame').className = (opt.stock === 'bleed') ? '' : 'on';
  }

  document.getElementById('bTray').addEventListener('click', function(){
    var t = document.getElementById('tray');
    var open = t.className === 'open';
    t.className = open ? '' : 'open';
    this.className = open ? '' : 'on';
  });

  document.getElementById('bShuffle').addEventListener('click', function(){ layout(); });

  document.getElementById('bFrame').addEventListener('click', function(){
    opt.stock = (opt.stock === 'bleed') ? 'polaroid' : 'bleed';
    syncFrameBtn(); syncStockSeg(); layout();
  });

  document.getElementById('bLive').addEventListener('click', function(){
    opt.live = !opt.live;
    this.className = opt.live ? 'on' : '';
    document.getElementById('rateName').textContent =
      opt.live ? 'Time drift' : 'Seconds per print';
    if(opt.live) ensureHist();
    updateLabel();
  });

  document.getElementById('bHold').addEventListener('click', function(){
    held = !held;
    this.className = held ? 'on' : '';
    this.textContent = held ? 'Held' : 'Hold';
  });

  document.getElementById('bFlip').addEventListener('click', function(){
    facing = (facing === 'user') ? 'environment' : 'user';
    histReady = false;
    start();
  });

  document.getElementById('bWall').addEventListener('click', function(){
    wallIdx = (wallIdx + 1) % WALLS.length;
    document.documentElement.style.setProperty('--wall', WALLS[wallIdx]);
  });

  document.getElementById('bSave').addEventListener('click', function(){
    labelEl.className = 'tucked';
    flash.style.transition = 'none';
    flash.style.opacity = '.85';
    setTimeout(function(){
      flash.style.transition = 'opacity .5s';
      flash.style.opacity = '0';
      labelEl.className = '';
    }, 60);

    var url;
    try { url = stage.toDataURL('image/png'); } catch(err){ return; }
    var a = document.createElement('a');
    if('download' in a){
      a.href = url;
      a.download = 'joiner-' + Date.now() + '.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } else {
      var w = window.open('','_blank');
      if(w) w.document.write('<img src="'+url+'" style="width:100%">');
    }
  });

  document.getElementById('bStart').addEventListener('click', start);

  syncFrameBtn();
  resize();
})();
</script>
</body>
</html>
